name: Garden storage verification
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: garden-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    name: archive-storage-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read/write integrity and access rejection tests
        run: node --test tests/storage/*.test.mjs
      - name: Bounded read-only import fixtures
        run: python3 -I -m unittest discover -s tests/import -v

name: Garden reviewed source transfer GDN-029
on:
  push:
    branches: [security/gdn-029-purpose-consent]
    paths: [bootstrap/GDN029-READY]
permissions:
  contents: write
concurrency:
  group: garden-transfer-029
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'neophilism/The-Garden' && github.actor == 'neophilism' && github.ref == 'refs/heads/security/gdn-029-purpose-consent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REF: refs/heads/security/gdn-029-purpose-consent
      SOURCE_SHA256: 0523c65b6fb0a47e6bb7b93fd098d3a313f1abb3edada0fba90ed45564ca7865
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Restore reviewed bytes and verify contracts
        run: |
          set -eu
          python3 bootstrap/apply_source_bundle.py
          python3 scripts/validate_plan.py
          python3 scripts/sync_roadmap.py
          python3 -m unittest discover -s tests/architecture -q
          python3 -m unittest discover -s tests/plan -q
          python3 -m unittest discover -s tests/database -q
      - name: Commit restored source to the fixed development branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin "$EXPECTED_REF" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'Garden repository automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/research/access apps/research/data packages/domain/src/consent tests/access db/migrations docs/security/consent-and-permitted-use.md docs/evidence/GDN-029 docs/evidence/GDN-037 docs/CURRENT_STATUS.md plan/execution.json plan/progress.json registry/roadmap.json .exechub/approved-pr-mapping.json
          git commit -m 'GDN-029: purpose-specific consent and current withdrawal enforcement'
          git push origin HEAD:"$EXPECTED_REF"

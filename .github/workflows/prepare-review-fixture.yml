name: Prepare exact scoped review fixture repair
on:
  push:
    branches: [research/gdn-039-scoped-reviews]
    paths: [scripts/prepare-review-fixture.py]
permissions:
  contents: write
concurrency:
  group: garden-review-fixture-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/research/gdn-039-scoped-reviews'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply exact fixture correction
        run: |
          set -eu
          python3 scripts/prepare-review-fixture.py
          rm scripts/prepare-review-fixture.py .github/workflows/prepare-review-fixture.yml
          test "$(git ls-remote origin refs/heads/research/gdn-039-scoped-reviews | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Garden source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'test: advance version in reviewer grant-version revocation fixture'
          git push origin HEAD:refs/heads/research/gdn-039-scoped-reviews

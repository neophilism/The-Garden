name: Garden GDN036 source materialization
on:
  push:
    branches: [data/gdn-036-archival-sources]
    paths: [.github/workflows/transfer-gdn036.yml]
permissions:
  contents: write
concurrency:
  group: garden-gdn036-source-materialization
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/data/gdn-036-archival-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Materialize only non-workflow source files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          python3 .transfer/gdn036/apply.py
          python3 scripts/validate_plan.py
          python3 scripts/sync_roadmap.py
          python3 scripts/reconcile_roadmap.py
          python3 -m unittest discover -s tests/plan -q
          python3 -m unittest discover -s tests/architecture -q
          python3 -m unittest discover -s tests/database -q
          node --test tests/application/*.test.mjs tests/environment/*.test.mjs tests/access/*.test.mjs tests/data/*.test.mjs
          git rm -r .transfer/gdn036
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test "$(git ls-remote origin refs/heads/data/gdn-036-archival-sources | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Garden repository automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'GDN-036: materialize archival sources, catalog assertions and lineage integrity'
          git push origin HEAD:refs/heads/data/gdn-036-archival-sources

name: Prepare exact audit ordering repair
on:
  push:
    branches: [security/gdn-030-audit-ledger]
    paths: [scripts/prepare-audit-order.py]
permissions:
  contents: write
concurrency:
  group: garden-audit-order-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/security/gdn-030-audit-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply bounded source repair and test
        run: |
          set -eu
          python3 scripts/prepare-audit-order.py
          node --test tests/access/audit.test.mjs
          rm scripts/prepare-audit-order.py .github/workflows/prepare-audit-order.yml
          test "$(git ls-remote origin refs/heads/security/gdn-030-audit-ledger | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Garden source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/research/access/audit.mjs apps/research/access/audit.ci.mjs tests/access/audit.test.mjs scripts/prepare-audit-order.py .github/workflows/prepare-audit-order.yml
          git commit -m 'fix: order audit pages by stored bigint and test multi-digit sequences'
          git push origin HEAD:refs/heads/security/gdn-030-audit-ledger

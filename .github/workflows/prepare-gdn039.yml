name: Prepare verified scoped review source
on:
  push:
    branches: [research/gdn-039-scoped-reviews]
    paths: [scripts/prepare-gdn039.py]
permissions:
  contents: write
concurrency:
  group: garden-gdn039-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/research/gdn-039-scoped-reviews'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore exact reviewed source and run contract tests
        run: |
          set -eu
          python3 scripts/prepare-gdn039.py
          node --test tests/application/*.test.mjs tests/environment/*.test.mjs tests/access/*.test.mjs tests/data/*.test.mjs tests/security/*.test.mjs tests/review/*.test.mjs
          python3 -m unittest discover -s tests/architecture -q
          python3 scripts/reconcile_roadmap.py
          rm scripts/prepare-gdn039.py bootstrap/gdn039-0.part bootstrap/gdn039-1.part bootstrap/gdn039-2.part .github/workflows/prepare-gdn039.yml
          git add --all
          test "$(git write-tree)" = '201c8b4ff7da1db47e9de59a15d79f80f87efa5b'
          test "$(git ls-remote origin refs/heads/research/gdn-039-scoped-reviews | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Garden source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'GDN-039: revision-scoped review axes, guarded decisions and dispute history'
          git push origin HEAD:refs/heads/research/gdn-039-scoped-reviews

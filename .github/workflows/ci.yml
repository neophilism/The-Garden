name: Garden repository checks
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: garden-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: plan-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate approved baseline
        run: python3 scripts/validate_plan.py
      - name: Plan regression tests
        run: python3 -m unittest discover -s tests/plan -v
  architecture:
    name: architecture-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate charter and run negative fixtures
        run: |
          set -eu
          python3 scripts/validate_charter.py
          python3 -m unittest discover -s tests/architecture -v
          printf 'Tested SHA: %s\n' "$GITHUB_SHA"
  application:
    name: application-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record tested source and runtime
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git archive --format=zip --output="$RUNNER_TEMP/garden-source.zip" HEAD
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.RUNNER_TEMP+"/runtime.json",JSON.stringify({tested_sha:process.env.GITHUB_SHA,pr_head_sha:process.env.PR_HEAD_SHA||null,node:process.version,platform:process.platform,arch:process.arch,run_id:process.env.GITHUB_RUN_ID},null,2))'
          sha256sum package-lock.json "$RUNNER_TEMP/garden-source.zip" > "$RUNNER_TEMP/source-sha256.txt"
      - name: Enforce committed dependency lock
        run: test -s package-lock.json
      - name: Install exact packages
        run: npm ci --include=dev --no-audit
      - name: Unit, type and executable build checks
        run: npm run check
      - name: Confirm static public output, nonindexable preview and no leaks
        run: |
          set -eu
          test -s apps/public/out/index.html
          test -s apps/public/out/robots.txt
          grep -qi 'History deserves' apps/public/out/index.html
          grep -qi 'funding' apps/public/out/funding/index.html
          grep -qi 'Disallow: /' apps/public/out/robots.txt
          ! grep -riE 'DATABASE_URL|IDENTITY_CLIENT_SECRET|GITHUB_APP_PRIVATE_KEY' apps/public/out
          printf 'Garden public static preview built at %s\n' "$GITHUB_SHA"
      - name: Preserve exact source and environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/garden-source.zip
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/source-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve successful static preview for browser review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-public-${{ github.run_id }}
          path: apps/public/out
          if-no-files-found: error
          retention-days: 30

name: Garden scoped conflict reconciliation
on:
  push:
    branches: [security/gdn-025-delivery-authorization]
    paths: [.github/workflows/source-recovery.yml]
permissions:
  contents: write
concurrency:
  group: garden-pr21-scoped-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/security/gdn-025-delivery-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve only the inspected canonical registry conflict
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          git config user.name 'Garden repository automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 8a804390e1bb9571072183a0dd0b6a7c9fcd90d1 || test "$(git diff --name-only --diff-filter=U)" = 'registry/roadmap.json'
          git show 8a804390e1bb9571072183a0dd0b6a7c9fcd90d1:registry/roadmap.json > registry/roadmap.json
          python3 scripts/sync_roadmap.py --write
          python3 scripts/sync_roadmap.py
          python3 scripts/validate_plan.py
          python3 -m unittest discover -s tests/plan -q
          python3 -m unittest discover -s tests/architecture -q
          node --test tests/access/*.test.mjs
          rm .github/workflows/source-recovery.yml
          git add registry/roadmap.json .github/workflows/source-recovery.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git ls-remote origin refs/heads/security/gdn-025-delivery-authorization | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'fix: merge pinned main and retain all canonical roadmap scopes'
          git push origin HEAD:refs/heads/security/gdn-025-delivery-authorization

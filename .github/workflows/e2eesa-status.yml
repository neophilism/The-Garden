name: E2EESA status record
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  status-record:
    name: Status record integrity (not product certification)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record exact checkout for merge review
        run: python3 scripts/record_ci_source.py
      - run: python3 scripts/validate_e2eesa_status.py

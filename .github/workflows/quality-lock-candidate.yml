name: Prepare quality tool lock candidate
on:
  push:
    branches: [quality/gdn-010-verification]
    paths: [tools/quality/package.json, .github/workflows/quality-lock-candidate.yml]
permissions:
  contents: read
jobs:
  lock-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate reviewable lock without scripts or repository writes
        working-directory: tools/quality
        run: |
          set -eu
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          sha256sum package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-quality-lock-${{ github.run_id }}
          path: tools/quality/package-lock.json
          if-no-files-found: error
          retention-days: 7

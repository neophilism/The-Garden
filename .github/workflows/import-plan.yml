name: Import approved planning baseline
on:
  push:
    branches: [bootstrap/approved-plan]
    paths: [bootstrap/READY]
permissions:
  contents: write
concurrency:
  group: garden-approved-plan-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/bootstrap/approved-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Restore exact approved text and validate it
        run: |
          set -eu
          python3 bootstrap/restore_plan.py
          python3 bootstrap/restore_plan.py --check
          python3 scripts/validate_plan.py
          python3 -m unittest discover -s tests/plan -v
      - name: Commit restored documentation to bootstrap branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin refs/heads/bootstrap/approved-plan | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'Garden repository automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: restore complete approved Garden planning baseline'
          git push origin HEAD:refs/heads/bootstrap/approved-plan

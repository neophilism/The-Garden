name: Garden quality and browser verification
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: garden-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: supply-chain-and-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install committed dependency locks
        run: |
          set -eu
          npm ci --include=dev --ignore-scripts --no-audit
          npm ci --prefix tools/quality --ignore-scripts --no-audit
      - name: Bind artifacts to the tested source and environment
        run: node tools/quality/write-evidence.mjs
      - name: Lint, workflow policy and failure canaries
        run: |
          set -eu
          node tools/quality/verify-policy.mjs
          node tools/quality/lint.mjs
          node --test tools/quality/unit/*.test.mjs
          python3 -m unittest discover -s tests/quality -v
          python3 scripts/reconcile_roadmap.py
      - name: Audit application dependencies
        run: npm audit --audit-level=high --json > "$RUNNER_TEMP/application-audit.json"
      - name: Audit test-tool dependencies
        run: npm audit --prefix tools/quality --audit-level=high --json > "$RUNNER_TEMP/tooling-audit.json"
      - name: Generate resolved dependency inventory
        run: npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/application-sbom.json"
      - name: Preserve assessment evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-policy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quality-environment.json
            ${{ runner.temp }}/application-audit.json
            ${{ runner.temp }}/tooling-audit.json
            ${{ runner.temp }}/application-sbom.json
          if-no-files-found: error
          retention-days: 30
  browser:
    name: browser-and-accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install committed dependency locks
        run: |
          set -eu
          npm ci --include=dev --ignore-scripts --no-audit
          npm ci --prefix tools/quality --ignore-scripts --no-audit
      - name: Bind artifacts to the tested source and environment
        run: node tools/quality/write-evidence.mjs
      - name: Install browser versions selected by the lock
        working-directory: tools/quality
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Build the applications and inspect actual static output
        run: |
          set -eu
          npm run check
          python3 scripts/verify_public_export.py
      - name: Browser journeys, responsive layout, accessibility and canary
        run: npm run test:browser --prefix tools/quality
      - name: Preserve screenshots, traces and complete accessibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quality-environment.json
            tools/quality/test-results
            tools/quality/playwright-report
          if-no-files-found: error
          retention-days: 30

name: Garden database verification
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: garden-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  database:
    name: database-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: garden-ci-synthetic-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GARDEN_DB_TARGET: ci
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: neondb
      PGUSER: postgres
      PGPASSWORD: garden-ci-synthetic-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Planner negative fixtures
        run: python3 -m unittest discover -s tests/database -v
      - name: Verify idempotent atomic migration twice
        run: |
          set -eu
          python3 scripts/db_migrate.py --apply
          python3 scripts/db_migrate.py --apply
      - name: Enforce actual PostgreSQL permission boundaries
        run: psql -X -w -f tests/database/roles.sql
      - name: Record database version and source
        run: |
          psql -X -w -Atc 'select version()'
          printf 'Tested source %s\n' "$GITHUB_SHA"

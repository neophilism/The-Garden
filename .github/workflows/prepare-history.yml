name: Prepare verified revision history repair
on:
  push:
    branches: [fix/numeric-revision-history]
    paths: [scripts/prepare-history.py]
permissions:
  contents: write
concurrency:
  group: garden-history-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'neophilism/The-Garden' && github.ref == 'refs/heads/fix/numeric-revision-history'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Restore bounded source and test
        run: |
          set -eu
          python3 scripts/prepare-history.py
          node --test tests/application/*.test.mjs tests/environment/*.test.mjs tests/access/*.test.mjs tests/data/*.test.mjs
          rm scripts/prepare-history.py bootstrap/history-edits.json .github/workflows/prepare-history.yml
          git add --all
          test "$(git write-tree)" = 'b2ff8c92c33f0cdc388eaa5df8f4ec66972c929b'
          test "$(git ls-remote origin refs/heads/fix/numeric-revision-history | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Garden source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: paginate historical, source and claim revisions by stored bigint'
          git push origin HEAD:refs/heads/fix/numeric-revision-history
